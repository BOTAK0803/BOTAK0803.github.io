<div class="mt-3 d-md-none"></div>
<div class="row">
  <div class="col">
    <div class="card border-0 shadow-sm bg-white">
      <div class="card-body p-4">
        <div class="row px-3 pt-3">
          <div class="col h3">
            <span data-lang-en>Maolei Huang</span>
            <span data-lang-zh style="display: none">黄茂雷</span>
          </div>
        </div>
        <div class="row p-3">
          <div class="col">
            <div
              data-lang-en
              class="text-profile-bio mt-0"
              {%
              if
              site.data.profile.short_bio_text_justify
              %}style="text-align: justify;"
              {%
              endif
              %}
            >
              {{ site.data.profile.short_bio }}
            </div>
            <div
              data-lang-zh
              style="display: none"
              class="text-profile-bio mt-0"
              {%
              if
              site.data.profile.short_bio_text_justify
              %}style="text-align: justify;"
              {%
              endif
              %}
            >
              {{ site.data.profile.short_bio_zh }}
            </div>
            {% if site.data.profile.cv_link %}
            <a
              class="btn btn-outline-primary mt-3"
              target="_blank"
              rel="noopener noreferrer"
              href="{{ site.data.profile.cv_link | relative_url }}"
              ><i class="fas fa-file-pdf mr-1"></i>
              <span data-lang-en>Curriculum Vitae</span>
              <span data-lang-zh style="display: none">个人简历</span></a
            >
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
