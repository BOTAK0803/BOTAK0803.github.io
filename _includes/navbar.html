<nav
  class="navbar navbar-expand-sm navbar-dark bg-dark fixed-top mb-5 shadow-sm"
>
  <div
    class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}"
  >
    <a class="navbar-brand"
      ><strong>{{site.data.profile.navbar_name}}</strong></a
    >
    <button
      class="navbar-toggler"
      style="font-size: 1em; padding: 0.5em"
      type="button"
      data-toggle="collapse"
      data-target="#navbarResponsive"
      aria-controls="navbarResponsive"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <i class="fas fa-map"></i> Menu
    </button>

    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ml-auto">
        {% for item in site.data.navigation.pages %}
        <li
          class="nav-item {% if item.name == page.navbar_title %}active{% endif %} {% if item.hidden %}d-none admin-only{% endif %}"
        >
          <a class="nav-link" href="{{ item.url | relative_url }}"
            >{{ item.name }}</a
          >
        </li>
        {% endfor %}
      </ul>
      <li class="nav-item" style="list-style: none">
        <a
          class="nav-link"
          href="javascript:void(0)"
          id="lang-toggle"
          onclick="toggleLang()"
          >中文</a
        >
      </li>
    </div>
  </div>
</nav>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    if (params.get("admin") === "1") {
      localStorage.setItem("admin-mode", "1");
      // Clean up URL without reload
      var cleanUrl = window.location.pathname;
      window.history.replaceState({}, "", cleanUrl);
    }
    if (localStorage.getItem("admin-mode") === "1") {
      document.querySelectorAll(".admin-only").forEach(function (el) {
        el.classList.remove("d-none");
      });
    }
  })();
</script>
