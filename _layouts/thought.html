---
layout: default
---

<article class="thought-article my-4 p-4 p-md-5 bg-white shadow-sm rounded-xl">
  <header class="thought-article-header mb-4">
    <a class="thought-back" href="{{ '/thoughts.html' | relative_url }}">
      ← Thoughts
    </a>
    <h1 class="mt-3 mb-2">{{ page.title }}</h1>
    <div class="text-muted">
      <i class="far fa-calendar-alt"></i>
      {{ page.date | date: "%Y-%m-%d" }}
    </div>
  </header>
  <div class="thought-article-body">
    {{ content }}
  </div>
</article>
