short_bio_text_justify: false
short_bio: >-
  <p>
  I am Maolei Huang, an <strong>Algorithm Expert</strong> at <strong>Amap (Alibaba)</strong> in <strong>Beijing</strong>. My current work centers on <strong>intelligent transportation algorithms</strong> and <strong>large-scale spatiotemporal modeling</strong>, including active collaborations with government authorities on the national-level <strong>"Eagle Eye" Traffic Early-Warning System</strong>. Prior to joining Amap, I worked at <strong>Fliggy (Alibaba E-commerce Business Group)</strong>, where I led the research and development of core <strong>search ranking</strong>, <strong>recommendation systems</strong>, and <strong>supply/revenue optimization</strong>. My industrial AI expertise spans end-to-end delivery—from business problem formulation, spatiotemporal and behavioral modeling, to ultra-low-latency online inference, reinforcement learning-driven control, and continuous iteration under strict safety, latency, and reliability constraints.
  </p>
  <p>
  My research interests include <strong>intelligent traffic systems</strong>, <strong>spatiotemporal risk prediction</strong>, <strong>search & ranking</strong>, <strong>LLM-powered agents and multi-agent collaboration</strong>, <strong>reinforcement learning</strong>, <strong>temporal and delayed-feedback learning</strong>, and <strong>multi-objective optimization</strong>. I received my <strong>M.S.</strong> from <strong>UCAS / ICT, CAS</strong> and my <strong>B.S.</strong> from <strong>Shandong University</strong>. My work has been published in premier venues including <strong>KDD</strong>, <strong>AAAI</strong>, <strong>SIGIR</strong>, <strong>ICLR</strong>, <strong>IEEE IoT-J</strong>, and <strong>ICDM</strong>, featuring <strong>first-author papers</strong> at <strong>KDD</strong>, <strong>AAAI</strong>, <strong>SIGIR</strong>, and <strong>ICDM</strong>, alongside multiple <strong>granted invention patents</strong>. I also serve as a <strong>Program Committee (PC) member for AAAI</strong> and a reviewer for top conferences including <strong>KDD</strong>, <strong>SIGIR</strong>, and <strong>RecSys</strong>. My mission is to bridge complex real-world challenges with algorithmic innovations, deploying reliable and scalable industrial AI systems across intelligent mobility and digital commerce.
  </p>


short_bio_zh: >-
  <p>
  我是黄茂雷，现任<strong>阿里巴巴高德地图（北京）</strong>的<strong>算法专家</strong>。我目前的工作主要聚焦于<strong>智能交通算法</strong>与<strong>大规模时空建模</strong>，并深度参与了与政府部门合作的国家级<strong>“鹰眼”交通安全预警系统</strong>的研发与落地。在此之前，我曾就职于<strong>阿里巴巴电商事业群（飞猪）</strong>，负责核心<strong>搜索排序算法</strong>、<strong>推荐系统</strong>以及<strong>供需与收益优化</strong>等关键技术的研发。我的工业级 AI 经验涵盖端到端全链路闭环——从复杂业务抽象、时空与行为特征建模、网络架构设计，到严苛低延迟、高可靠与高安全约束下的在线服务部署、线上实验与持续迭代。
  </p>
  <p>
  我的研究兴趣包括<strong>智能交通系统</strong>、<strong>时空风险预测与预警</strong>、<strong>搜索排序与推荐</strong>、<strong>大语言模型与多智能体协同</strong>、<strong>强化学习</strong>、<strong>延迟反馈/时序学习</strong>以及<strong>多目标优化</strong>。我硕士毕业于<strong>中国科学院大学 / 中科院计算所（UCAS / ICT, CAS）</strong>，本科毕业于<strong>山东大学</strong>。相关研究成果已发表于 <strong>KDD</strong>、<strong>AAAI</strong>、<strong>SIGIR</strong>、<strong>ICLR</strong>、<strong>IEEE IoT-J</strong>、<strong>ICDM</strong> 等国际顶级学术会议及期刊，其中包含以<strong>第一作者</strong>身份发表的 <strong>KDD</strong>、<strong>AAAI</strong>、<strong>SIGIR</strong> 和 <strong>ICDM</strong> 顶会论文，并拥有多项<strong>授权发明专利</strong>。此外，我还担任 <strong>AAAI 程序委员会委员（PC Member）</strong>，以及 <strong>KDD</strong>、<strong>SIGIR</strong>、<strong>RecSys</strong> 等顶级会议的审稿人。我的目标是将现实世界中的交通出行与商业搜索场景转化为算法突破，打造高可靠、可规模化落地的工业级智能系统。
  </p>


