short_bio_text_justify: false
short_bio: >-
  <p>
    I am Maolei Huang, an <strong>algorithm expert</strong> and <strong>researcher</strong> at <strong>Alibaba</strong> in <strong>Beijing</strong>. My work focuses on <strong>large-scale ranking</strong> and <strong>recommendation systems</strong>, <strong>supply and revenue optimization</strong>, and <strong>LLM-powered ranking</strong> and <strong>agent systems</strong>, covering industrial AI from problem formulation, feature and model design, and training optimization to online serving, experimentation, and continuous iteration under strict latency and reliability constraints.
  </p>
  <p>
    My research interests include <strong>generative ranking</strong>, <strong>user behavior modeling</strong>, <strong>temporal and delayed-feedback learning</strong>, <strong>LLM alignment</strong>, <strong>reinforcement learning</strong>, <strong>multi-agent collaboration</strong>, and <strong>multi-objective optimization</strong>. I received my <strong>M.S.</strong> from <strong>UCAS</strong>/<strong>ICT, CAS</strong> and my <strong>B.S.</strong> from <strong>Shandong University</strong>. My work has been published at <strong>KDD</strong>, <strong>AAAI</strong>, <strong>SIGIR</strong>, <strong>ICLR</strong>, <strong>IEEE IoT-J</strong>, and <strong>ICDM</strong>, including <strong>first-author publications</strong> at <strong>KDD</strong>, <strong>AAAI</strong>, and <strong>SIGIR</strong>, along with <strong>granted invention patents</strong>. I also serve as a reviewer for <strong>KDD</strong>, <strong>RecSys</strong>, and <strong>SIGIR</strong>. My goal is to turn real-world challenges into algorithmic innovations and translate advances in ranking, recommendation, LLMs, and agents into scalable industrial systems.
  </p>

short_bio_zh: >-
  <p>
    我是 Maolei Huang，目前在<strong>阿里巴巴北京</strong>担任<strong>算法专家</strong>与<strong>研究员</strong>，主要从事<strong>大规模排序</strong>与<strong>推荐系统</strong>、<strong>供给与收入优化</strong>，以及基于大模型的<strong>排序</strong>与<strong>智能体系统</strong>。我的工作覆盖工业级 AI 的端到端落地，包括问题建模、特征与模型设计、训练优化、在线服务、实验评估和持续迭代，并长期面对低延迟与高可靠性约束。
  </p>
  <p>
    我的研究兴趣包括<strong>生成式排序</strong>、<strong>用户行为建模</strong>、<strong>时序与延迟反馈学习</strong>、<strong>LLM 对齐</strong>、<strong>强化学习</strong>、<strong>多智能体协作</strong>和<strong>多目标优化</strong>。我硕士毕业于<strong>中国科学院大学</strong>/<strong>中科院计算所</strong>，本科毕业于<strong>山东大学</strong>。相关研究成果发表于 <strong>KDD</strong>、<strong>AAAI</strong>、<strong>SIGIR</strong>、<strong>ICLR</strong>、<strong>IEEE IoT-J</strong> 和 <strong>ICDM</strong>，包括 <strong>KDD</strong>、<strong>AAAI</strong> 和 <strong>SIGIR</strong> 的<strong>第一作者</strong>论文，并获得<strong>多项发明专利授权</strong>；同时担任 <strong>KDD</strong>、<strong>RecSys</strong> 和 <strong>SIGIR</strong> 审稿人。我的目标是将真实业务挑战转化为算法创新，并把排序、推荐、大模型和智能体方向的研究进展落地为可扩展的工业系统。
  </p>

