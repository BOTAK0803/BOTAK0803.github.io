short_bio_text_justify: false
short_bio: >-
  <p>
    I am a researcher and senior algorithm engineer at Alibaba in Beijing, specializing in large-scale ranking and recommendation systems, supply and revenue optimization, and LLM-powered ranking and agents. My work spans the full lifecycle of industrial AI, from problem formulation, data and feature development, and model design to online serving, experimentation, and continuous optimization under strict latency and reliability constraints. My research interests include generative ranking, user behavior and intent modeling, temporal and delayed-feedback learning, LLM alignment, parameter-efficient fine-tuning, reinforcement learning, multi-agent collaboration, multi-task learning, cross-domain transfer, and multi-objective optimization.
  </p>
  <p>
    I received my M.S. in Computer Architecture from the University of Chinese Academy of Sciences, where I studied at the Institute of Computing Technology, Chinese Academy of Sciences, and my B.S. in Software Engineering from Shandong University. My work has led to first-author publications at KDD, AAAI, and SIGIR, as well as granted invention patents. I also serve as a reviewer for leading AI, information retrieval, and data mining venues, including KDD, RecSys, and SIGIR. My goal is to build a productive feedback loop between research and production: real-world challenges inspire new algorithmic formulations, while research advances are translated into robust, scalable systems that deliver measurable improvements in user experience and business efficiency.
  </p>

short_bio_zh: >-
  <p>
    我目前在阿里巴巴北京担任算法研究与高级算法工程师，主要研究方向包括大规模搜索排序与推荐系统、供给与收益优化，以及基于大语言模型的生成式排序与智能体。我的工作覆盖工业智能系统的完整链路，包括业务问题抽象、数据与特征建设、模型设计、在线服务、实验评估，以及严格时延与稳定性约束下的持续迭代。研究兴趣包括生成式排序、用户行为与意图建模、时序及延迟反馈学习、LLM 对齐、参数高效微调、强化学习、多智能体协作、多任务学习、跨域迁移和多目标优化。
  </p>
  <p>
    我本科毕业于山东大学软件工程专业，随后在中国科学院计算技术研究所学习，并获得中国科学院大学计算机系统结构硕士学位。相关研究成果以第一作者发表于 KDD、AAAI、SIGIR 等国际顶级会议，并获得多项发明专利授权；同时担任 KDD、RecSys、SIGIR 等人工智能、信息检索与数据挖掘领域国际会议审稿人。我希望持续构建学术研究与工业实践之间的正向闭环：从真实生产问题中提炼具有研究价值的算法问题，再将研究成果转化为稳定、可扩展的工业系统，持续改善用户体验、商业效率和长期技术竞争力。
  </p>

