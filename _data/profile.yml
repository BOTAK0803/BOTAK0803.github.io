short_bio_text_justify: false
short_bio: >-
  <p>
    I am a <strong>researcher</strong> and <strong>senior algorithm engineer</strong> at <strong>Alibaba</strong> in <strong>Beijing</strong>, working on <strong>large-scale ranking</strong>, <strong>recommendation systems</strong>, and <strong>LLM-powered ranking and agents</strong>. My work covers the lifecycle of industrial AI, from problem formulation and model design to online serving and experimentation. My research interests include <strong>generative ranking</strong>, <strong>user behavior and intent modeling</strong>, <strong>temporal and delayed-feedback learning</strong>, <strong>reinforcement learning</strong>, <strong>multi-task learning</strong>, and <strong>multi-objective optimization</strong>.
  </p>
  <p>
    I received my <strong>M.S. in Computer Architecture</strong> from <strong>UCAS</strong>, where I studied at the <strong>Institute of Computing Technology, CAS</strong>, and my <strong>B.S. in Software Engineering</strong> from <strong>Shandong University</strong>. I have published at <strong>KDD</strong>, <strong>AAAI</strong>, <strong>SIGIR</strong>, <strong>ICLR</strong>, and <strong>IEEE IoT-J</strong>, including first-author papers at KDD, AAAI, and SIGIR. I also hold granted invention patents and review for <strong>KDD</strong>, <strong>RecSys</strong>, and <strong>SIGIR</strong>. I aim to turn real-world challenges into generalizable research and scalable production systems.
  </p>

short_bio_zh: >-
  <p>
    我目前在<strong>阿里巴巴北京</strong>担任<strong>算法研究</strong>与<strong>高级算法工程师</strong>，主要从事<strong>大规模搜索排序</strong>、<strong>推荐系统</strong>以及大语言模型驱动的<strong>生成式排序与智能体</strong>研究。工作覆盖业务问题抽象、模型设计、在线服务与实验评估。研究兴趣包括<strong>生成式排序</strong>、<strong>用户行为与意图建模</strong>、<strong>时序与延迟反馈学习</strong>、<strong>强化学习</strong>、<strong>多任务学习</strong>和<strong>多目标优化</strong>。
  </p>
  <p>
    我本科毕业于<strong>山东大学软件工程专业</strong>，随后在<strong>中国科学院计算技术研究所</strong>学习，并获得<strong>中国科学院大学计算机系统结构硕士学位</strong>。研究成果发表于 <strong>KDD</strong>、<strong>AAAI</strong>、<strong>SIGIR</strong>、<strong>ICLR</strong> 和 <strong>IEEE IoT-J</strong>，其中以<strong>第一作者</strong>发表于 KDD、AAAI 和 SIGIR，并获得多项发明专利授权；同时担任 KDD、RecSys、SIGIR 等国际会议审稿人。我希望从真实业务中提炼通用算法问题，并将研究成果转化为稳定、可扩展的工业系统。
  </p>

