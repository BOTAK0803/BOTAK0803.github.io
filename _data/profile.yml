short_bio_text_justify: false
short_bio: >-
  <p>
    I am a <strong>researcher</strong> and <strong>senior algorithm engineer</strong> at <strong>Alibaba</strong> in <strong>Beijing</strong>, specializing in <strong>large-scale ranking</strong> and <strong>recommendation systems</strong>, <strong>supply optimization</strong> and <strong>revenue optimization</strong>, and <strong>LLM-powered ranking</strong> and <strong>agents</strong>. My work spans the full lifecycle of industrial AI, from problem formulation, data and feature development, and model design to online serving, experimentation, and continuous optimization under strict latency and reliability constraints. My research interests include <strong>generative ranking</strong>, <strong>user behavior</strong> and <strong>intent modeling</strong>, <strong>temporal learning</strong> and <strong>delayed-feedback learning</strong>, <strong>LLM alignment</strong>, <strong>parameter-efficient fine-tuning</strong>, <strong>reinforcement learning</strong>, <strong>multi-agent collaboration</strong>, <strong>multi-task learning</strong>, <strong>cross-domain transfer</strong>, and <strong>multi-objective optimization</strong>.
  </p>
  <p>
    I received my <strong>M.S. in Computer Architecture</strong> from the <strong>University of Chinese Academy of Sciences</strong> (<strong>UCAS</strong>), where I studied at the <strong>Institute of Computing Technology</strong> (<strong>ICT</strong>), <strong>Chinese Academy of Sciences</strong> (<strong>CAS</strong>), and my <strong>B.S. in Software Engineering</strong> from <strong>Shandong University</strong> (<strong>SDU</strong>). My work has led to publications at <strong>KDD</strong>, <strong>AAAI</strong>, <strong>SIGIR</strong>, <strong>ICLR</strong>, and <strong>IEEE IoT-J</strong>, including <strong>first-author publications</strong> at <strong>KDD</strong>, <strong>AAAI</strong>, and <strong>SIGIR</strong>, as well as <strong>granted invention patents</strong>. I also serve as a reviewer for leading AI, information retrieval, and data mining venues, including <strong>KDD</strong>, <strong>RecSys</strong>, and <strong>SIGIR</strong>. My goal is to build a productive feedback loop between research and production: real-world challenges inspire new algorithmic formulations, while research advances are translated into robust, scalable systems that deliver measurable improvements in user experience and business efficiency.
  </p>

short_bio_zh: >-
  <p>
    我目前在<strong>阿里巴巴北京</strong>担任<strong>算法研究</strong>与<strong>高级算法工程师</strong>，主要研究方向包括<strong>大规模搜索排序</strong>与<strong>推荐系统</strong>、<strong>供给优化</strong>与<strong>收益优化</strong>，以及基于大语言模型的<strong>生成式排序</strong>与<strong>智能体</strong>。我的工作覆盖工业智能系统的完整链路，包括业务问题抽象、数据与特征建设、模型设计、在线服务、实验评估，以及严格时延与稳定性约束下的持续迭代。研究兴趣包括<strong>生成式排序</strong>、<strong>用户行为</strong>与<strong>意图建模</strong>、<strong>时序学习</strong>及<strong>延迟反馈学习</strong>、<strong>LLM 对齐</strong>、<strong>参数高效微调</strong>、<strong>强化学习</strong>、<strong>多智能体协作</strong>、<strong>多任务学习</strong>、<strong>跨域迁移</strong>和<strong>多目标优化</strong>。
  </p>
  <p>
    我本科毕业于<strong>山东大学</strong>（<strong>SDU</strong>）<strong>软件工程专业</strong>，随后在<strong>中国科学院计算技术研究所</strong>（<strong>ICT</strong>）学习，并获得<strong>中国科学院大学</strong>（<strong>UCAS</strong>）<strong>计算机系统结构硕士学位</strong>。相关研究成果发表于 <strong>KDD</strong>、<strong>AAAI</strong>、<strong>SIGIR</strong>、<strong>ICLR</strong>、<strong>IEEE IoT-J</strong> 等国际顶级会议与期刊，其中以<strong>第一作者</strong>发表于 <strong>KDD</strong>、<strong>AAAI</strong> 和 <strong>SIGIR</strong>，并获得<strong>多项发明专利授权</strong>；同时担任 <strong>KDD</strong>、<strong>RecSys</strong>、<strong>SIGIR</strong> 等人工智能、信息检索与数据挖掘领域国际会议审稿人。我希望持续构建学术研究与工业实践之间的正向闭环：从真实生产问题中提炼具有研究价值的算法问题，再将研究成果转化为稳定、可扩展的工业系统，持续改善用户体验、商业效率和长期技术竞争力。
  </p>

